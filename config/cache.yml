default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# database:を指定しないのでprimaryの接続をそのまま使う
# Render free + SupabaseはDBが1つで、DATABASE_URLがdatabase.ymlのdatabase:を
# 上書きするため、cache接続を分けても同じDBに解決されるだけだった
production:
  <<: *default
