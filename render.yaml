services:
  - type: web
    name: zoozoo-farm
    runtime: ruby
    region: singapore
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
      bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Render 는 기본으로 WEB_CONCURRENCY=1 을 넣는다. 0 을 명시해 싱글 모드로 돌린다.
      # 왜 그래야 하는지는 .claude/rules/notes/infra.md
      - key: WEB_CONCURRENCY
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Supabase Storage(S3 프로토콜). 값은 Render 대시보드에서 직접 넣는다.
      # 비어 있어도 앱은 뜨고, 파일을 다루는 시점에야 인증이 실패한다.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
