default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# database: 를 지정하지 않아 primary 의 연결을 그대로 쓴다 (notes/infra.md)
production:
  <<: *default
