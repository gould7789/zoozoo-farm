version: 2
updates:
# 보안 갱신은 Dependabot alerts 쪽에서 처리하므로
# 여기서는 버전 갱신의 빈도와 범위만 다룬다
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    # gem 마다 PR 이 난립하는 것을 막으려 하나로 묶는다
    bundler:
      patterns:
        - "*"
  ignore:
    # 메이저 갱신은 호환성 확인이 필요하므로 자동 PR 대상에서 뺀다
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
        - "*"
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
