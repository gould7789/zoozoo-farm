services:
  - type: web
    name: zoozoo-farm
    runtime: ruby
    region: singapore
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
      bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Renderは既定でWEB_CONCURRENCY=1を注入する。Pumaはこの値が1以上だと
      # クラスターモードで起動し、ワーカーが1つでもマスタープロセスが常駐して
      # メモリだけを消費する（Puma自身が起動時に警告を出す）。
      # 無料プランの512MB内で画像変換を行うため0を明示してシングルモードにする。
      # 処理能力はスレッド3本のままで変わらない。
      - key: WEB_CONCURRENCY
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Supabase Storage（S3プロトコル）。値はRenderのダッシュボードで直接入力する。
      # 未入力でもアプリは起動し、ファイル操作の時点で初めて認証に失敗する。
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
